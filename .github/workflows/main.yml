name: Deploy to Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GH_TOKEN
          script_stop: true
          script: |
            set -e
            export GIT_TERMINAL_PROMPT=0

            cd /var/www/myapp/nc_idpl_cms
            git fetch https://x-access-token:${GH_TOKEN}@github.com/IdeaptDigital/nc_idpl_cms.git main
            git reset --hard FETCH_HEAD
            echo "Deployed commit:"
            git log -1 --oneline

            # --- Backend ---
            cd backend
            npm install
            pm2 restart project-backend || pm2 start npm --name "project-backend" -- start
            cd ..

            # --- Frontend ---
            cd frontend
            npm install
            npm run build
