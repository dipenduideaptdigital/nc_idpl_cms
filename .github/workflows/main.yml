name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /var/www/myapp/nc_idpl_cms
            git pull origin main

            # --- Backend ---
            cd backend
            npm install
            pm2 restart project-backend  || pm2 start npm --name "project-backend" -- start
            cd ..

            # --- Frontend ---
            cd frontend
            npm install
            npm run build
            cd ..
